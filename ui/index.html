<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Coach</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <h1>English Coach</h1>
      <span class="badge" id="levelBadge" title="Trình độ hiện tại"></span>
    </div>
    <div class="top-right">
      <span class="badge warn" id="problemsBadge" hidden></span>
    </div>
  </header>
  <div class="banner" id="sampleBanner" hidden>
    <span>Đang hiển thị <b>dữ liệu mẫu</b>. Khi bắt đầu học thật, hãy xóa đi.</span>
    <button class="btn" id="sampleDelete" type="button">Xóa dữ liệu mẫu</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Các tab">
    <button type="button" data-tab="today">Hôm nay</button>
    <button type="button" data-tab="vocab">Từ vựng</button>
    <button type="button" data-tab="lessons">Buổi học</button>
    <button type="button" data-tab="path">Lộ trình</button>
    <button type="button" data-tab="progress">Tiến bộ</button>
    <button type="button" data-tab="rules">Quy tắc</button>
    <button type="button" data-tab="prompt">Prompt</button>
  </nav>
  <section class="page" id="page" aria-live="polite"></section>
  <footer class="foot">English Coach · agent dạy và ghi dữ liệu, app chỉ hiển thị và quản lý</footer>
</main>
<div class="toast" id="toast" hidden></div>
</body>
</html>
